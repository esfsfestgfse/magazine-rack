name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and Worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: false

      - name: Validate required project files
        run: npm run check

      - name: Parse Worker JavaScript
        run: |
          find apps -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check whitespace errors
        run: git diff --check
